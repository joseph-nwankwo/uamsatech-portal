# Reverse proxy for the Next.js app (deploy/../Dockerfile, port 3000).
# Written for a standard nginx install in front of the app container —
# nginx isn't available in this sandbox, so this is syntax-correct and
# follows documented nginx/Next.js deployment practice, but hasn't been
# runtime-tested against real traffic. Validate with `nginx -t` before use.

# Edge-layer rate limiting — a second, independent layer in front of the
# app's own per-route in-memory limiter (lib/auth/rate-limit.ts). This one
# catches raw request-flood abuse before it ever reaches Node; the app layer
# still owns action-specific limits (5 signups/hour, 10 login attempts/15min,
# etc.) that depend on parsed request bodies nginx can't see.
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Only real deployer-owned monitoring infrastructure should ever reach
# /api/metrics — replace with your actual Prometheus scraper's address(es).
geo $metrics_allowed {
  default         0;
  127.0.0.1/32    1;
  10.0.0.0/8      1;
}

upstream uamsatech_app {
  server app:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name uamsatech.com www.uamsatech.com;

  # ACME HTTP-01 challenge path for certbot/Let's Encrypt — keep this above
  # the redirect so renewal doesn't break once TLS is live.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name uamsatech.com www.uamsatech.com;

  # Placeholder paths — point these at real certificates (e.g. from certbot)
  # before this config is used anywhere real.
  ssl_certificate     /etc/letsencrypt/live/uamsatech.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/uamsatech.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
    text/xml application/xml application/xml+rss text/javascript;

  client_max_body_size 5m;

  # Immutable, content-hashed build assets — safe to cache for a year.
  location /_next/static/ {
    proxy_pass http://uamsatech_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/metrics {
    if ($metrics_allowed = 0) {
      return 403;
    }
    proxy_pass http://uamsatech_app;
    proxy_set_header Host $host;
  }

  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://uamsatech_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    limit_req zone=general burst=40 nodelay;
    proxy_pass http://uamsatech_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
