# TEMPLATE ONLY — every value below is a placeholder, not a real credential.
# Never fill this file in and commit it. Generate the real Secret at deploy
# time instead, e.g.:
#   kubectl create secret generic uamsatech-secrets \
#     --namespace uamsatech \
#     --from-literal=AUTH_JWT_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=DATABASE_URL="postgresql://..." \
#     --dry-run=client -o yaml | kubectl apply -f -
# or manage it with Sealed Secrets / External Secrets Operator / Vault so
# real values never touch the git history at all.
apiVersion: v1
kind: Secret
metadata:
  name: uamsatech-secrets
  namespace: uamsatech
type: Opaque
stringData:
  AUTH_JWT_SECRET: "REPLACE_ME_min_32_chars"
  DATABASE_URL: "postgresql://user:password@host:5432/uamsatech"
  RESEND_API_KEY: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  PAYSTACK_SECRET_KEY: ""
  PAYSTACK_WEBHOOK_SECRET: ""
  FLUTTERWAVE_SECRET_KEY: ""
  FLUTTERWAVE_WEBHOOK_SECRET: ""
  ADMIN_EMAILS: ""
  METRICS_TOKEN: ""
  # Recommend a managed Redis (ElastiCache, Upstash, etc.) over self-hosting
  # a stateful Redis pod in-cluster without an operator — docker-compose.yml
  # in this repo self-hosts it for local/single-node use only.
  REDIS_URL: ""
  S3_BUCKET: ""
  S3_REGION: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_ENDPOINT: ""
  S3_PUBLIC_URL: ""
