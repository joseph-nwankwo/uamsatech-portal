name: Deploy

# Builds and publishes the Docker image on every push to main, once CI has
# passed. Deliberately stops at "image pushed to the registry" rather than
# also deploying to a live host — this repo has no actual server/cluster
# target configured (no kubeconfig, no SSH host, no cloud credentials), so
# writing a deploy step past this point would be inventing infrastructure
# that doesn't exist. Wire a final step here (kubectl apply, a platform CLI,
# an SSH+compose pull, etc.) once a real target exists.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
